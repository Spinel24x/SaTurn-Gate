<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaTurn Gate | Edge Proxy</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --card-bg: rgba(255,255,255,0.03);
            --gold: #f39c12;
            --green: #27ae60;
            --red: #e74c3c;
            --text: #e0e0e0;
            --text-dim: #888;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #1a1a3a 50%, var(--bg) 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 40px 30px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 3em;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold), var(--red), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .subtitle { color: var(--text-dim); font-size: 1em; margin-top: 8px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 24px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 28px;
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
        }
        .card h2 {
            font-size: 1.3em;
            margin-bottom: 24px;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.82em; font-weight: 500; }
        input, select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.92em;
            transition: all 0.3s;
            font-family: inherit;
        }
        input:focus, select:focus { outline: none; border-color: var(--gold); background: rgba(255,255,255,0.07); }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold), #e67e22);
            border: none;
            border-radius: 12px;
            color: #1a1a3a;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(243,156,18,0.3); }
        button:active { transform: scale(0.97); }
        button.secondary {
            background: rgba(255,255,255,0.05);
            color: var(--gold);
            border: 1px solid rgba(243,156,18,0.3);
        }
        button.danger { background: rgba(231,76,60,0.15); color: var(--red); }
        button.success { background: rgba(39,174,96,0.15); color: var(--green); }
        .config-box {
            background: rgba(0,0,0,0.5);
            padding: 16px;
            border-radius: 12px;
            margin-top: 16px;
            border: 1px solid rgba(39,174,96,0.2);
        }
        .config-text {
            width: 100%;
            min-height: 100px;
            background: transparent;
            color: var(--green);
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            word-break: break-all;
            line-height: 1.7;
            resize: vertical;
        }
        .ip-list { max-height: 400px; overflow-y: auto; margin-top: 16px; }
        .ip-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            margin-bottom: 6px;
            border: 1px solid transparent;
            gap: 10px;
        }
        .ip-item:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.08); }
        .ip-info { flex: 1; min-width: 0; }
        .ip-address { font-family: 'Courier New', monospace; font-weight: 600; color: var(--gold); }
        .ip-meta { font-size: 0.72em; color: var(--text-dim); margin-top: 2px; }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7em;
            font-weight: 700;
        }
        .badge-clean { background: rgba(39,174,96,0.2); color: var(--green); }
        .badge-ok { background: rgba(243,156,18,0.2); color: var(--gold); }
        .badge-slow { background: rgba(231,76,60,0.2); color: var(--red); }
        .tabs { display: flex; gap: 6px; margin-bottom: 20px; background: rgba(255,255,255,0.03); padding: 5px; border-radius: 12px; }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            color: #777;
            transition: all 0.3s;
        }
        .tab.active { background: rgba(243,156,18,0.15); color: var(--gold); }
        .tab:hover { color: var(--gold); }
        .btn-row { display: flex; gap: 10px; margin-top: 12px; }
        .btn-row button { flex: 1; }
        .stats { display: flex; gap: 10px; margin-top: 12px; }
        .stat {
            flex: 1;
            text-align: center;
            padding: 12px 8px;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .stat-value { font-size: 1.4em; font-weight: 700; color: var(--gold); }
        .stat-label { font-size: 0.7em; color: var(--text-dim); margin-top: 4px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .loading { text-align: center; padding: 30px; }
        .spinner {
            border: 3px solid rgba(255,255,255,0.08);
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hint { font-size: 0.7em; color: #555; margin-top: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🪐 SaTurn Gate</h1>
            <p class="subtitle">Cloudflare Edge Proxy | VLESS + Trojan | بدون نیاز به VPS</p>
        </div>

        <div class="grid">
            <!-- اسکنر -->
            <div class="card">
                <h2>🔍 اسکنر IP تمیز</h2>
                <div class="form-group">
                    <label>پورت</label>
                    <select id="scanPort">
                        <option value="443">443</option>
                        <option value="8443">8443</option>
                        <option value="2053">2053</option>
                        <option value="443,8443,2053,2083,2087,2096">همه</option>
                    </select>
                </div>
                <button onclick="startScan()">🚀 شروع اسکن</button>
                <div class="stats" id="scanStats" style="display:none;">
                    <div class="stat"><div class="stat-value" id="statOpen">0</div><div class="stat-label">باز</div></div>
                    <div class="stat"><div class="stat-value" id="statClean">0</div><div class="stat-label">⚡ تمیز</div></div>
                    <div class="stat"><div class="stat-value" id="statBest">-</div><div class="stat-label">بهترین</div></div>
                </div>
                <div id="scanStatus" style="display:none;"></div>
                <div id="scanResults" class="ip-list"></div>
            </div>

            <!-- تولید کانفیگ -->
            <div class="card">
                <h2>⚙️ تولید کانفیگ</h2>
                
                <div class="tabs" id="typeTabs">
                    <div class="tab active" data-type="vless">🔷 VLESS</div>
                    <div class="tab" data-type="trojan">🔶 Trojan</div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>🌐 Address</label>
                        <input type="text" id="address" placeholder="IP یا دامنه">
                    </div>
                    <div class="form-group">
                        <label>🔌 Port</label>
                        <input type="number" id="port" value="443">
                    </div>
                </div>

                <div class="form-group">
                    <label>🔒 SNI</label>
                    <input type="text" id="sni" value="www.google.com">
                </div>

                <div class="form-group">
                    <label>📝 Remark</label>
                    <input type="text" id="remark" placeholder="نام کانفیگ">
                </div>

                <div class="form-group">
                    <label>🆔 UUID/Password (اختیاری)</label>
                    <input type="text" id="uuid" placeholder="خالی = خودکار">
                    <div class="hint">برای VLESS: UUID | برای Trojan: Password</div>
                </div>

                <button onclick="generateConfig()">🎯 تولید کانفیگ</button>
                
                <div id="configResult" class="config-box" style="display:none;">
                    <textarea class="config-text" id="configOutput" readonly></textarea>
                    <div class="btn-row">
                        <button onclick="copyConfig()" class="secondary">📋 کپی</button>
                        <button onclick="downloadConfig()" class="secondary">💾 دانلود</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- IPهای ذخیره شده -->
        <div class="card" style="margin-top: 24px;">
            <h2>📊 نتایج اسکن</h2>
            <div class="btn-row" style="margin-bottom: 20px; max-width: 400px;">
                <button onclick="loadSavedIPs()" class="secondary">🔄 بارگذاری</button>
                <button onclick="clearIPs()" class="danger">🗑 پاک کردن</button>
            </div>
            <div id="savedIPs" class="ip-list"></div>
        </div>
    </div>

    <script>
        var activeType = 'vless';

        document.querySelectorAll('#typeTabs .tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('#typeTabs .tab').forEach(function(t) { t.classList.remove('active'); });
                this.classList.add('active');
                activeType = this.getAttribute('data-type');
            });
        });

        async function startScan() {
            var scanStatus = document.getElementById('scanStatus');
            var scanResults = document.getElementById('scanResults');
            var stats = document.getElementById('scanStats');
            
            scanStatus.style.display = 'block';
            stats.style.display = 'flex';
            scanStatus.innerHTML = '<div class="loading"><div class="spinner"></div><p>در حال اسکن...</p></div>';
            scanResults.innerHTML = '';
            
            var portStr = document.getElementById('scanPort').value;
            var ports = portStr.split(',').map(function(p) { return parseInt(p.trim()); });
            
            try {
                var response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ports: ports })
                });
                
                var data = await response.json();
                scanStatus.style.display = 'none';
                
                if (data.results && data.results.length > 0) {
                    document.getElementById('statOpen').textContent = data.total || 0;
                    document.getElementById('statClean').textContent = data.clean || 0;
                    document.getElementById('statBest').textContent = data.results[0].latency + 'ms';
                    
                    var html = '';
                    for (var i = 0; i < data.results.length; i++) {
                        var ip = data.results[i];
                        var badgeClass = ip.clean ? 'badge-clean' : (ip.latency < 500 ? 'badge-ok' : 'badge-slow');
                        var badgeText = ip.clean ? '⚡ تمیز' : (ip.latency < 500 ? 'متوسط' : 'کند');
                        
                        html += '<div class="ip-item">' +
                            '<div class="ip-info">' +
                            '<span class="ip-address">' + ip.ip + ':' + ip.port + '</span>' +
                            '<div class="ip-meta"><span class="badge ' + badgeClass + '">' + badgeText + '</span> ⏱ ' + ip.latency + 'ms | 📍 ' + (ip.datacenter || '?') + '</div>' +
                            '</div>' +
                            '<button onclick="useIP(\'' + ip.ip + '\', ' + ip.port + ')" class="success" style="padding:6px 12px;font-size:0.75em;width:auto;">📡</button>' +
                            '</div>';
                    }
                    scanResults.innerHTML = html;
                } else {
                    scanResults.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:20px;">IP بازی پیدا نشد</p>';
                }
            } catch (error) {
                scanStatus.innerHTML = '<p style="color:var(--red);">خطا: ' + error.message + '</p>';
            }
        }

        function useIP(ip, port) {
            document.getElementById('address').value = ip;
            document.getElementById('port').value = port;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function generateConfig() {
            var address = document.getElementById('address').value.trim();
            var port = document.getElementById('port').value.trim();
            var sni = document.getElementById('sni').value.trim();
            var remark = document.getElementById('remark').value.trim();
            var uuid = document.getElementById('uuid').value.trim();
            
            if (!address) {
                alert('لطفاً Address را وارد کنید');
                return;
            }
            
            var endpoint = activeType === 'vless' ? '/api/generate-vless' : '/api/generate-trojan';
            
            try {
                var response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        address: address,
                        port: parseInt(port) || 443,
                        sni: sni || 'www.google.com',
                        remark: remark || '',
                        uuid: uuid || '',
                        password: uuid || ''
                    })
                });
                
                var data = await response.json();
                document.getElementById('configResult').style.display = 'block';
                document.getElementById('configOutput').value = data.config;
                if (data.uuid) document.getElementById('uuid').value = data.uuid;
                
                document.getElementById('configResult').scrollIntoView({ behavior: 'smooth', block: 'center' });
            } catch (error) {
                alert('خطا: ' + error.message);
            }
        }

        function copyConfig() {
            var textarea = document.getElementById('configOutput');
            textarea.select();
            textarea.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                alert('✅ کپی شد!');
            } catch(e) {
                prompt('دستی کپی کنید:', textarea.value);
            }
        }

        function downloadConfig() {
            var config = document.getElementById('configOutput').value;
            if (!config) return;
            var blob = new Blob([config], { type: 'text/plain' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'saturn-' + activeType + '.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        async function loadSavedIPs() {
            try {
                var response = await fetch('/api/scanned-ips');
                var ips = await response.json();
                var html = '';
                if (ips.length > 0) {
                    for (var i = 0; i < ips.length; i++) {
                        var ip = ips[i];
                        html += '<div class="ip-item">' +
                            '<div class="ip-info"><span class="ip-address">' + ip.ip + ':' + ip.port + '</span>' +
                            '<div class="ip-meta">⏱ ' + (ip.latency || '?') + 'ms</div></div>' +
                            '<button onclick="useIP(\'' + ip.ip + '\', ' + ip.port + ')" class="success" style="padding:6px 12px;font-size:0.75em;width:auto;">📡</button></div>';
                    }
                } else {
                    html = '<p style="color:var(--text-dim);text-align:center;">خالی</p>';
                }
                document.getElementById('savedIPs').innerHTML = html;
            } catch (e) {}
        }

        async function clearIPs() {
            if (!confirm('پاک کردن همه؟')) return;
            await fetch('/api/clear-scans', { method: 'POST' });
            document.getElementById('savedIPs').innerHTML = '<p style="color:var(--text-dim);text-align:center;">پاک شد</p>';
        }

        loadSavedIPs();
        
        try {
            document.getElementById('address').placeholder = 'خالی = ' + window.location.hostname;
        } catch(e) {}
    </script>
</body>
</html>
