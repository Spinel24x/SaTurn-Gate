<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaTurn Gate | پنل حرفه‌ای کانفیگ Xray</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0a0a1a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 30px;
            background: rgba(255,255,255,0.03);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 3em;
            font-weight: 900;
            background: linear-gradient(135deg, #f39c12, #e74c3c, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header .subtitle { color: #666; font-size: 1.1em; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 24px;
        }
        .card {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 28px;
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
        }
        .card h2 {
            font-size: 1.3em;
            margin-bottom: 24px;
            color: #f39c12;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            margin-bottom: 6px;
            color: #999;
            font-size: 0.85em;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95em;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #f39c12;
            background: rgba(255,255,255,0.08);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            border-radius: 12px;
            color: #1a1a3a;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(243, 156, 18, 0.3); }
        button:active { transform: scale(0.98); }
        button.secondary {
            background: rgba(255,255,255,0.05);
            color: #f39c12;
            border: 1px solid rgba(243, 156, 18, 0.3);
        }
        button.danger {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }
        .result-box {
            background: rgba(0,0,0,0.3);
            padding: 16px;
            border-radius: 12px;
            margin-top: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .config-text {
            width: 100%;
            min-height: 100px;
            background: rgba(0,0,0,0.4);
            color: #27ae60;
            border: 1px solid rgba(39, 174, 96, 0.3);
            border-radius: 10px;
            padding: 14px;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            word-break: break-all;
            line-height: 1.6;
            resize: vertical;
        }
        .ip-list { max-height: 400px; overflow-y: auto; margin-top: 16px; }
        .ip-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .ip-item:hover { background: rgba(255,255,255,0.06); }
        .ip-info { display: flex; flex-direction: column; gap: 2px; }
        .ip-address { font-family: monospace; font-size: 0.95em; font-weight: 600; color: #f39c12; }
        .ip-details { font-size: 0.75em; color: #888; }
        .loading { text-align: center; padding: 30px; color: #888; }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #f39c12;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: rgba(255,255,255,0.03); padding: 6px; border-radius: 14px; }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.3s;
            color: #888;
        }
        .tab.active { background: rgba(243, 156, 18, 0.2); color: #f39c12; }
        .tab:hover { color: #f39c12; }
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn-row button { flex: 1; }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.7em;
            font-weight: 700;
        }
        .badge-clean { background: rgba(39, 174, 96, 0.2); color: #27ae60; }
        .badge-cf { background: rgba(243, 156, 18, 0.2); color: #f39c12; }
        .stats { display: flex; gap: 12px; margin-top: 12px; }
        .stat { flex: 1; text-align: center; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 10px; }
        .stat-value { font-size: 1.3em; font-weight: 700; color: #f39c12; }
        .stat-label { font-size: 0.75em; color: #888; margin-top: 4px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .hint { font-size: 0.7em; color: #666; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🪐 SaTurn Gate</h1>
            <p class="subtitle">اسکنر IP تمیز + هسته هوشمند تولید کانفیگ Xray | VLESS + Trojan + Reality + WS</p>
        </div>

        <div class="grid">
            <!-- اسکنر -->
            <div class="card">
                <h2>🔍 اسکنر IP تمیز</h2>
                <div class="form-group">
                    <label>پورت هدف</label>
                    <select id="scanPorts">
                        <option value="443">443 (HTTPS/Reality)</option>
                        <option value="8443">8443</option>
                        <option value="2053">2053</option>
                        <option value="443,8443,2053,2083,2087,2096">همه پورت‌های CF</option>
                    </select>
                </div>
                <button onclick="startScan()">🚀 شروع اسکن</button>
                <div class="stats" id="scanStats" style="display:none;">
                    <div class="stat"><div class="stat-value" id="totalOpen">0</div><div class="stat-label">باز</div></div>
                    <div class="stat"><div class="stat-value" id="totalClean">0</div><div class="stat-label">تمیز ⚡</div></div>
                </div>
                <div id="scanStatus" class="result-box" style="display:none;"></div>
                <div id="scanResults" class="ip-list"></div>
            </div>

            <!-- تولید کانفیگ -->
            <div class="card">
                <h2>⚙️ هسته تولید کانفیگ</h2>
                
                <div class="tabs" id="typeTabs">
                    <div class="tab active" data-type="vless">VLESS</div>
                    <div class="tab" data-type="trojan">Trojan</div>
                </div>

                <div class="form-group">
                    <label>📝 Remark (نام کانفیگ)</label>
                    <input type="text" id="remark" placeholder="مثال: SaTurn-IR">
                </div>

                <div class="form-group">
                    <label>🌐 Address (IP تمیز یا دامنه)</label>
                    <input type="text" id="address" placeholder="از اسکنر انتخاب کنید یا دامنه Worker">
                    <div class="hint">اگر خالی بماند = باید دستی وارد کنید</div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>🔌 Port</label>
                        <input type="number" id="port" value="443">
                    </div>
                    <div class="form-group">
                        <label>🆔 UUID</label>
                        <input type="text" id="uuid" placeholder="خالی = خودکار">
                    </div>
                </div>

                <div class="form-group">
                    <label>🔒 SNI (دامنه فیلتر نشده)</label>
                    <input type="text" id="sni" value="www.google.com" placeholder="www.google.com">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>🌍 Network</label>
                        <select id="network">
                            <option value="ws">WebSocket (WS)</option>
                            <option value="tcp">TCP</option>
                            <option value="grpc">gRPC</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🛡 Security</label>
                        <select id="security">
                            <option value="reality">Reality</option>
                            <option value="tls">TLS</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" id="wsHostBox">
                    <label>🏠 WS Host (دامنه Worker)</label>
                    <input type="text" id="wsHost" placeholder="worker-name.workers.dev">
                </div>

                <div class="form-group" id="wsPathBox">
                    <label>📁 WS Path</label>
                    <input type="text" id="wsPath" placeholder="خالی = /UUID">
                    <div class="hint">پیش‌فرض: /[UUID]</div>
                </div>

                <div class="form-row-3">
                    <div class="form-group">
                        <label>🖐 Fingerprint</label>
                        <select id="fp">
                            <option value="chrome">Chrome</option>
                            <option value="firefox">Firefox</option>
                            <option value="safari">Safari</option>
                            <option value="edge">Edge</option>
                            <option value="random">Random</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>📋 ALPN</label>
                        <select id="alpn">
                            <option value="h2,http/1.1">h2,http/1.1</option>
                            <option value="http/1.1">http/1.1</option>
                            <option value="h2">h2</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🔑 Short ID</label>
                        <input type="text" id="sid" value="6ba85179">
                    </div>
                </div>

                <button onclick="generateConfig()">🎯 تولید کانفیگ</button>
                
                <div id="configResult" class="result-box" style="display:none;">
                    <textarea class="config-text" id="configOutput" readonly></textarea>
                    <div class="btn-row" style="margin-top:12px;">
                        <button onclick="copyConfig()" class="secondary">📋 کپی</button>
                        <button onclick="downloadConfig()" class="secondary">💾 دانلود</button>
                    </div>
                    <details style="margin-top:12px;">
                        <summary style="color:#f39c12;cursor:pointer;font-size:0.9em;">📝 کانفیگ سرور Xray</summary>
                        <textarea class="config-text" id="serverConfigOutput" readonly style="margin-top:8px;color:#888;min-height:150px;"></textarea>
                    </details>
                </div>
            </div>
        </div>

        <!-- IPهای ذخیره شده -->
        <div class="card" style="margin-top: 24px;">
            <h2>📊 IPهای اسکن شده</h2>
            <div class="btn-row" style="margin-bottom: 20px; max-width: 400px;">
                <button onclick="loadSavedIPs()" class="secondary">🔄 بارگذاری</button>
                <button onclick="clearIPs()" class="danger">🗑 پاک کردن</button>
            </div>
            <div id="savedIPs" class="ip-list"></div>
        </div>
    </div>

    <script>
        var activeType = 'vless';

        // Tab switching
        document.querySelectorAll('#typeTabs .tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('#typeTabs .tab').forEach(function(t) { t.classList.remove('active'); });
                this.classList.add('active');
                activeType = this.getAttribute('data-type');
            });
        });

        // Show/hide WS fields based on network
        document.getElementById('network').addEventListener('change', function() {
            var isWS = this.value === 'ws';
            document.getElementById('wsHostBox').style.display = isWS ? 'block' : 'none';
            document.getElementById('wsPathBox').style.display = isWS ? 'block' : 'none';
        });

        async function startScan() {
            var scanStatus = document.getElementById('scanStatus');
            var scanResults = document.getElementById('scanResults');
            var stats = document.getElementById('scanStats');
            
            scanStatus.style.display = 'block';
            stats.style.display = 'flex';
            scanStatus.innerHTML = '<div class="loading"><div class="spinner"></div><p>در حال اسکن...</p></div>';
            scanResults.innerHTML = '';
            
            var ports = document.getElementById('scanPorts').value.split(',').map(function(p) { return parseInt(p.trim()); });
            
            try {
                var response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ports: ports })
                });
                
                var data = await response.json();
                scanStatus.style.display = 'none';
                
                document.getElementById('totalOpen').textContent = data.total || 0;
                document.getElementById('totalClean').textContent = data.clean || 0;
                
                if (data.results && data.results.length > 0) {
                    displayResults(data.results);
                } else {
                    scanResults.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">IP بازی پیدا نشد</p>';
                }
            } catch (error) {
                scanStatus.innerHTML = '<p style="color:#e74c3c;">✗ خطا: ' + error.message + '</p>';
            }
        }

        function displayResults(ips) {
            var html = '';
            for (var i = 0; i < ips.length; i++) {
                var ip = ips[i];
                html += '<div class="ip-item">' +
                    '<div class="ip-info">' +
                    '<span class="ip-address">' + ip.ip + ':' + ip.port + '</span>' +
                    '<span class="ip-details">' +
                    '<span class="badge ' + (ip.clean ? 'badge-clean' : 'badge-cf') + '">' + (ip.clean ? 'تمیز' : 'CF') + '</span> ' +
                    'پینگ: ' + (ip.latency || '?') + 'ms' +
                    '</span>' +
                    '</div>' +
                    '<button onclick="useIP(\'' + ip.ip + '\', ' + ip.port + ')" class="secondary" style="padding:6px 10px;font-size:0.75em;">📡 استفاده</button>' +
                    '</div>';
            }
            document.getElementById('scanResults').innerHTML = html;
        }

        function useIP(ip, port) {
            document.getElementById('address').value = ip;
            document.getElementById('port').value = port;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function generateConfig() {
            var address = document.getElementById('address').value;
            var port = document.getElementById('port').value;
            var sni = document.getElementById('sni').value;
            var uuid = document.getElementById('uuid').value;
            var network = document.getElementById('network').value;
            var security = document.getElementById('security').value;
            var fp = document.getElementById('fp').value;
            var alpn = document.getElementById('alpn').value;
            var sid = document.getElementById('sid').value;
            var wsHost = document.getElementById('wsHost').value;
            var wsPath = document.getElementById('wsPath').value;
            var remark = document.getElementById('remark').value;
            
            if (!address || !port) {
                alert('⚠️ لطفاً Address و Port را وارد کنید');
                return;
            }
            
            var payload = {
                type: activeType,
                address: address,
                port: parseInt(port),
                sni: sni,
                uuid: uuid,
                network: network,
                security: security,
                fp: fp,
                alpn: alpn,
                sid: sid,
                remark: remark
            };
            
            if (network === 'ws') {
                payload.host = wsHost;
                payload.path = wsPath;
            }
            
            try {
                var response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                var data = await response.json();
                document.getElementById('configResult').style.display = 'block';
                document.getElementById('configOutput').value = data.config;
                document.getElementById('serverConfigOutput').value = data.serverConfig || '';
            } catch (error) {
                alert('خطا: ' + error.message);
            }
        }

        function copyConfig() {
            var textarea = document.getElementById('configOutput');
            textarea.select();
            try {
                document.execCommand('copy');
                alert('✅ کپی شد!');
            } catch(e) {
                alert('دستی کپی کنید');
            }
        }

        function downloadConfig() {
            var config = document.getElementById('configOutput').value;
            var blob = new Blob([config], { type: 'text/plain' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'saturn-config-' + Date.now() + '.txt';
            a.click();
        }

        async function loadSavedIPs() {
            try {
                var response = await fetch('/api/scanned-ips');
                var ips = await response.json();
                var html = '';
                
                if (ips.length > 0) {
                    for (var i = 0; i < ips.length; i++) {
                        var ip = ips[i];
                        html += '<div class="ip-item">' +
                            '<div class="ip-info">' +
                            '<span class="ip-address">' + ip.ip + ':' + ip.port + '</span>' +
                            '<span class="ip-details">پینگ: ' + (ip.latency || '?') + 'ms | ' + (ip.datacenter || '') + '</span>' +
                            '</div>' +
                            '<button onclick="useIP(\'' + ip.ip + '\', ' + ip.port + ')" class="secondary" style="padding:6px 12px;">استفاده</button>' +
                            '</div>';
                    }
                } else {
                    html = '<p style="color:#888;">هیچ IP ذخیره نشده</p>';
                }
                
                document.getElementById('savedIPs').innerHTML = html;
            } catch (error) {
                console.error(error);
            }
        }

        async function clearIPs() {
            if (confirm('پاک کردن همه؟')) {
                await fetch('/api/clear-scans', { method: 'POST' });
                document.getElementById('savedIPs').innerHTML = '<p style="color:#888;">پاک شد</p>';
            }
        }

        loadSavedIPs();
    </script>
</body>
</html>
