name = "saturn-gate"
main = "worker.js"
compatibility_date = "2024-01-01"

# برای ذخیره نتایج اسکن
[[kv_namespaces]]
binding = "KV"
id = "smart"  # این رو بعداً از داشبورد کلادفلیر می‌گیری

# برای اسکن تدریجی
[[durable_objects.bindings]]
name = "SCANNER"
class_name = "ScannerDO"

# برای دور زدن محدودیت زمانی اسکن
[[migrations]]
tag = "v1"
new_classes = ["ScannerDO"]

# تنظیمات CORS برای پنل
[[routes]]
pattern = "/*"
zone_name = "your-domain.workers.dev"
